name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Test
        run: go test ./...
      - name: Build Linux binaries
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            mkdir -p "build/$arch"
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags='-s -w' -o "build/$arch/chat-with-cli" ./cmd/chat-with-cli
            cp "build/$arch/chat-with-cli" "dist/chat-with-cli-linux-$arch"
            tar -C "build/$arch" -czf "dist/chat-with-cli_${GITHUB_REF_NAME}_linux_${arch}.tar.gz" chat-with-cli
          done
          (cd dist && sha256sum chat-with-cli-linux-* chat-with-cli_*.tar.gz > SHA256SUMS)
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          extra=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            extra+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            dist/chat-with-cli-linux-amd64 \
            dist/chat-with-cli-linux-arm64 \
            dist/chat-with-cli_*.tar.gz \
            dist/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME" \
            "${extra[@]}"
